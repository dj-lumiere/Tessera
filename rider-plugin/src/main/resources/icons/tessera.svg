<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 100 100">
<!-- Four tesserae as a diamond CFG: entry, two branches, and a merge block with two block parameters. -->
  <mask id="params">
    <rect width="100" height="100" fill="#fff"/>
    <circle cx="44" cy="78" r="3.4" fill="#000"/>
    <circle cx="56" cy="78" r="3.4" fill="#000"/>
  </mask>
  <g transform="rotate(45 50 50)">
    <rect x="17" y="17" width="31" height="31" rx="3.5" fill="#B39DDB"/>
    <rect x="52" y="17" width="31" height="31" rx="3.5" fill="#8E6FD0"/>
    <rect x="17" y="52" width="31" height="31" rx="3.5" fill="#8E6FD0"/>
  </g>
  <g mask="url(#params)">
    <rect x="52" y="52" width="31" height="31" rx="3.5" fill="#7C4DFF" transform="rotate(45 50 50)"/>
  </g>
</svg>
