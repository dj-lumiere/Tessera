name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Where the builder finds Ingrid's library (the Checkout Ingrid step of each job).
  TESSERA_INGRID: ${{ github.workspace }}/ingrid-checkout/tessera

jobs:
  # The golden tests (tests/, examples/) on every host the builder supports, 64-bit and, where the
  # host can run it, 32-bit. Mini/ is a separate repo and is not checked out here.
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # A hung test fails the job here instead of holding the runner for GitHub's six hours. Each test program has its
    # own 10 s limit in the test runner, and each golden step its own limit below.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
          - os: ubuntu-latest
            target: x86-linux-gnu
          - os: windows-latest
            target: x86_64-windows-msvc
          - os: windows-latest
            target: x86-windows-msvc
          - os: macos-latest
            target: aarch64-macos-none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ingrid's library (import Ingrid/Decimal) is part of every build, as the standard library is: the builder reads
      # it from TESSERA_INGRID.
      - name: Checkout Ingrid
        uses: actions/checkout@v4
        with:
          repository: dj-lumiere/Ingrid
          path: ingrid-checkout

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          # A failed download must fail the step: piped into bash, an empty script would succeed and leave the
          # runner's own clang (18) in place, which crashes on some targets.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          test -x /usr/bin/clang-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
          clang --version | grep -q 'clang version 21' || { clang --version; echo 'clang is not LLVM 21'; exit 1; }
          clang --version

      # 32-bit crt files, libc, libm, and libgcc for clang --target=i686-linux-gnu.
      - name: Install 32-bit libraries (Linux)
        if: matrix.target == 'x86-linux-gnu'
        run: sudo apt-get install -y gcc-multilib

      - name: Cache LLVM 21 (Windows)
        if: runner.os == 'Windows'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm21
          key: llvm-21.1.8-win64

      - name: Download LLVM 21 (Windows)
        if: runner.os == 'Windows' && steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed' }
          New-Item -ItemType Directory -Force C:\llvm21 | Out-Null
          tar -xf llvm.tar.xz -C C:\llvm21 --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extract failed' }
          Remove-Item llvm.tar.xz

      - name: Put LLVM 21 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH 'C:\llvm21\bin'

      # Keg-only; GITHUB_PATH entries are prepended, so this shadows Apple clang. Homebrew's clang links against the
      # Command Line Tools' SDK, so the linker comes from the Command Line Tools too: the selected Xcode's ld can be
      # older than that SDK and reject its libSystem.tbd ("unknown architecture"). macOS takes Homebrew's current LLVM,
      # not LLVM 21: LLVM 21's ThreadSanitizer runtime crashes at startup on macOS 26 (in __tsan::SlotLock, an empty C
      # program built with -fsanitize=thread included), so tests/race_check could only crash there.
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun --find ld
          DEVELOPER_DIR=/Library/Developer/CommandLineTools ld -v

      - name: Verify toolchain
        run: clang --version

      - name: Build
        id: build
        run: dotnet build Tessera.csproj --configuration Release

      - name: Check formatting
        if: matrix.target == 'x86_64-linux-gnu'
        run: dotnet bin/Release/net10.0/tessera.dll fmt --check Standard tests examples

      - name: Check chain length
        if: matrix.target == 'x86_64-linux-gnu'
        run: dotnet bin/Release/net10.0/tessera.dll lint Standard tests examples

      - name: Check the stdlib
        run: dotnet bin/Release/net10.0/tessera.dll check --target ${{ matrix.target }}

      # An untraced build's own declarations stand in for the trace's; check them too.
      - name: Check the stdlib (untraced)
        run: dotnet bin/Release/net10.0/tessera.dll check --target ${{ matrix.target }} --no-trace

      # The crash trace costs an untraced build nothing: no trace storage, and no calls to the routines a traced build
      # places. A traced build has both, so the names searched for are the right ones.
      - name: An untraced build has no trace
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          trace='5TRACEB|trace_(push|at|pop)'
          dotnet bin/Release/net10.0/tessera.dll build --emit-llvm examples/fizzbuzz.te -o traced.ll
          dotnet bin/Release/net10.0/tessera.dll build --emit-llvm --no-trace examples/fizzbuzz.te -o untraced.ll
          grep -Eq "$trace" traced.ll || { echo 'the traced build has no trace: the names searched for are stale'; exit 1; }
          if grep -En "$trace" untraced.ll; then
            echo 'the untraced build has trace storage or calls (above)'
            exit 1
          fi

      # A routine copy every image may hold (a generic instance, a stdlib routine) is hidden, so a program and a shared
      # library each call their own copy, the one that reads their own globals. Mach-O's loader would otherwise bind
      # the library's calls to the program's copies (a crash message written into one buffer and read from another).
      - name: Shared routine copies are hidden
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          for target in x86_64-linux-gnu aarch64-macos-none; do
            dotnet bin/Release/net10.0/tessera.dll build --target $target --emit-llvm examples/fizzbuzz.te -o "shared-$target.ll"
            grep -q '^define linkonce_odr hidden ' "shared-$target.ll" || { echo "$target: no shared routine copy, the search is stale"; exit 1; }
            if grep -nP '^define linkonce_odr (?!hidden )' "shared-$target.ll"; then
              echo "$target: shared routine copies that other images can bind to (above)"
              exit 1
            fi
          done

      # Every build mode: a test's output must not depend on the optimization level or the debug information. Each
      # mode runs even when another fails, so one run shows which modes break.
      - name: Golden tests (debug)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: dotnet bin/Release/net10.0/tessera.dll test --target ${{ matrix.target }} --mode debug tests examples

      - name: Golden tests (release)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: dotnet bin/Release/net10.0/tessera.dll test --target ${{ matrix.target }} --mode release tests examples

      - name: Golden tests (release-time)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: dotnet bin/Release/net10.0/tessera.dll test --target ${{ matrix.target }} --mode release-time tests examples

      - name: Golden tests (release-space)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        run: dotnet bin/Release/net10.0/tessera.dll test --target ${{ matrix.target }} --mode release-space tests examples

  # Targets no hosted runner runs: type-check the stdlib and have LLVM compile it for each (no link, so no sysroot or
  # emulator). Catches backend crashes and lowering gaps, such as llvm.minimum on 32-bit ARM.
  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [arm-linux-gnueabihf, aarch64-linux-gnu]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ingrid's library (import Ingrid/Decimal) is part of every build, as the standard library is: the builder reads
      # it from TESSERA_INGRID.
      - name: Checkout Ingrid
        uses: actions/checkout@v4
        with:
          repository: dj-lumiere/Ingrid
          path: ingrid-checkout

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 21
        run: |
          # A failed download must fail the step: piped into bash, an empty script would succeed and leave the
          # runner's own clang (18) in place, which crashes on some targets.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          test -x /usr/bin/clang-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          clang --version | grep -q 'clang version 21' || { clang --version; echo 'clang is not LLVM 21'; exit 1; }
          clang --version

      - name: Build
        run: dotnet build Tessera.csproj --configuration Release

      - name: Check the stdlib
        run: dotnet bin/Release/net10.0/tessera.dll check --target ${{ matrix.target }}

      # The fiber tests can't run here, but they build: switch_stack's assembly (ARM code for arm-linux-gnueabihf)
      # goes through the assembler, and nothing else in them is target-specific.
      - name: Build the fiber tests to objects
        run: |
          for test in fiber_scheduler fiber_workers fiber_wait fiber_io; do
            dotnet bin/Release/net10.0/tessera.dll build --target ${{ matrix.target }} --emit-llvm tests/$test.te -o "$test.ll"
            clang --target=${{ matrix.target }} -c -Wno-override-module "$test.ll" -o "$test.o"
          done

  # Targets without an operating system: the stdlib checks there (Standard/Os drops out), and the programs built for
  # one (tests/freestanding, and tests/freestanding_float, which uses every float operation and integer division; the
  # golden run skips both) leave nothing undefined: no C++ unwinding personality (every routine is nounwind), and no
  # C memory routine, soft-float routine, or other compiler-rt / libgcc helper (the stdlib exports memcpy, memset,
  # memmove, memcmp, ARM's __aeabi_mem*, and System/Numerics/SoftFloat's runtime there). Each writes its own
  # when_power_on, and the builder writes the entry around it (on Cortex-M the vector table) and links the program
  # with the link script it writes from the board's memory map (boards/<board>.toml, which also gives the CPU: a
  # Cortex-M on 32-bit ARM, since the generated entry there is a Cortex-M reset vector). The targets with a fiber
  # switch (all but RISC-V) also build tests/freestanding_fiber, which switches to a fiber on a stack of its own and
  # back.
  freestanding:
    name: freestanding (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm-none-eabi
            board: qemu-mps2-an385
            fibers: freestanding_fiber
          - target: riscv32-none-elf
            board: qemu-virt-riscv32
            rng-feature: zkr
          - target: aarch64-none-elf
            board: qemu-virt-aarch64
            rng-feature: rand
            fibers: freestanding_fiber
            qemu: qemu-system-arm
          - target: x86_64-none-elf
            board: pc-x86_64
            rng-feature: rdrnd
            fibers: freestanding_fiber

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ingrid's library (import Ingrid/Decimal) is part of every build, as the standard library is: the builder reads
      # it from TESSERA_INGRID.
      - name: Checkout Ingrid
        uses: actions/checkout@v4
        with:
          repository: dj-lumiere/Ingrid
          path: ingrid-checkout

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 21
        run: |
          # A failed download must fail the step: piped into bash, an empty script would succeed and leave the
          # runner's own clang (18) in place, which crashes on some targets.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          test -x /usr/bin/clang-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/llvm-nm-21 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
          clang --version | grep -q 'clang version 21' || { clang --version; echo 'clang is not LLVM 21'; exit 1; }
          clang --version

      - name: Build
        run: dotnet build Tessera.csproj --configuration Release

      - name: Check the stdlib
        run: dotnet bin/Release/net10.0/tessera.dll check --target ${{ matrix.target }}

      # With the CPU's random number instruction (RDRAND, RNDR, the Zkr seed CSR) the stdlib exports the hash key
      # itself (Standard/System/HashKey.te): check that code too. The default CPUs above have none of them.
      - name: Check the stdlib with a random number instruction
        if: matrix.rng-feature != ''
        run: dotnet bin/Release/net10.0/tessera.dll check --target ${{ matrix.target }} --feature ${{ matrix.rng-feature }}

      # Nothing at all may stay undefined: the programs put their own reporting routine in the Crash service's slot
      # (and freestanding_float, which hashes, exports its hash key: these CPUs have no random number instruction),
      # and the stdlib supplies the rest. That rules out an unwinding personality (__aeabi_unwind_cpp_pr0), a thread
      # pointer (__tls_get_addr, __aeabi_read_tp, __emutls_get_address: the crash trace is a plain global here), the C
      # memory routines, and every compiler-rt / libgcc helper. The link has no C library (-nostdlib), so lld fails on
      # any symbol left undefined. A release build compiles at -O2, so LLVM's optimizations get their chance to call
      # something too.
      - name: Build and link the programs with the board's memory map
        run: |
          # tests/freestanding_fiber switches stacks with Fiber's switch_stack, which RISC-V doesn't have.
          for program in freestanding freestanding_float ${{ matrix.fibers }}; do
            for mode in debug release; do
              elf="$program-$mode.elf"
              dotnet bin/Release/net10.0/tessera.dll build --board ${{ matrix.board }} --mode $mode \
                tests/$program/main.te -o "$elf"
              llvm-nm "$elf" | grep -q ' T when_power_on$' || { echo "tests/$program ($mode) has no when_power_on"; exit 1; }
              echo "tests/$program ($mode): nothing undefined, linked"
            done
          done

      # The tests that run on a board in QEMU (tests/<name>.qemu names the emulator): the ThreadManagerByRoundRobin's
      # preemption, sleep, word wait, and idle thread on QEMU's virt machine. The golden run skips them where the
      # emulator isn't installed.
      - name: Run the programs for the board in QEMU
        if: matrix.qemu
        run: |
          sudo apt-get install -y ${{ matrix.qemu }}
          command -v qemu-system-aarch64
          tests=$(for q in tests/*.qemu; do t="${q%.qemu}"; grep -q "board = \"${{ matrix.board }}\"" "$t/config.toml" && echo "$t/config.toml"; done)
          dotnet bin/Release/net10.0/tessera.dll test $tests

  # Hosted 32-bit targets: their C runtime may lack the 128-bit helpers (libgcc builds __udivti3, __fixdfti, and the
  # rest only for 64-bit targets; compiler-rt has them for riscv32 but not for 32-bit ARM or x86). The stdlib's U128 /
  # S128 division divides by limbs there (Standard/System/Numerics/Div128.te), and Standard/System/Numerics/SoftFloat/Exports.te supplies every
  # 128-bit helper LLVM may still call (a program's own udiv<U128>, the float conversions). tests/div128 (the stdlib's
  # division and LLVM's own udiv / sdiv / urem / srem on i128) and tests/int128_float (every B32 / B64 <-> S128 / U128
  # conversion) are built to objects, debug and release, and no 128-bit division or conversion helper may stay
  # undefined. Other undefined symbols (the C library's) are the link's business and not checked here.
  hosted-32-bit-int128:
    name: hosted 32-bit 128-bit helpers (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm-linux-gnueabihf
            clang-target: armv7-unknown-linux-gnueabihf
          - target: x86-linux-gnu
            clang-target: i686-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ingrid's library (import Ingrid/Decimal) is part of every build, as the standard library is: the builder reads
      # it from TESSERA_INGRID.
      - name: Checkout Ingrid
        uses: actions/checkout@v4
        with:
          repository: dj-lumiere/Ingrid
          path: ingrid-checkout

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 21
        run: |
          # A failed download must fail the step: piped into bash, an empty script would succeed and leave the
          # runner's own clang (18) in place, which crashes on some targets.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          test -x /usr/bin/clang-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/llvm-nm-21 /usr/local/bin/llvm-nm
          clang --version | grep -q 'clang version 21' || { clang --version; echo 'clang is not LLVM 21'; exit 1; }
          clang --version

      - name: Build
        run: dotnet build Tessera.csproj --configuration Release

      # `-c` needs no sysroot: the objects are only inspected, never linked.
      - name: Build the programs and require that no 128-bit helper is undefined
        run: |
          for program in div128 int128_float; do
            for mode in debug release; do
              ll="$program-$mode.ll"
              obj="$program-$mode.o"
              level=-O0
              if [ "$mode" = release ]; then level=-O2; fi
              dotnet bin/Release/net10.0/tessera.dll build --target ${{ matrix.target }} --mode $mode --emit-llvm \
                tests/$program.te -o "$ll"
              clang --target=${{ matrix.clang-target }} $level -c -Wno-override-module "$ll" -o "$obj"
              undefined=$(llvm-nm -u "$obj" | grep -E '__(u?(div|mod)ti3|fix(uns)?[sdh]fti|float(un)?ti[sdh]f)' || true)
              if [ -n "$undefined" ]; then
                echo "tests/$program for ${{ matrix.target }} ($mode) leaves 128-bit helpers undefined that its C runtime may lack:"
                echo "$undefined"
                exit 1
              fi
              echo "tests/$program ($mode): no 128-bit helper undefined"
            done
          done

  # The long check of the soft-float runtime (tests/soft_float_exhaustive; tests/soft_float is the golden run's sample):
  # every B32 bit pattern through square root and every conversion out of B32, every S32 / U32 into B32 and B64, every
  # B16, and millions of random operand pairs, against the hardware and libgcc's conversions. It runs on every core
  # in release mode and fails on any mismatch.
  soft-float-exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ingrid's library (import Ingrid/Decimal) is part of every build, as the standard library is: the builder reads
      # it from TESSERA_INGRID.
      - name: Checkout Ingrid
        uses: actions/checkout@v4
        with:
          repository: dj-lumiere/Ingrid
          path: ingrid-checkout

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 21
        run: |
          # A failed download must fail the step: piped into bash, an empty script would succeed and leave the
          # runner's own clang (18) in place, which crashes on some targets.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          test -x /usr/bin/clang-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld
          clang --version | grep -q 'clang version 21' || { clang --version; echo 'clang is not LLVM 21'; exit 1; }

      - name: Build
        run: dotnet build Tessera.csproj --configuration Release

      - name: Run the exhaustive check
        run: dotnet bin/Release/net10.0/tessera.dll run --mode release tests/soft_float_exhaustive/main.te

  # SonarQube analysis of the C# builder, with coverage from the golden tests. Whether the tests pass is the test
  # job's call, so a failing test doesn't stop the analysis here. SonarQube lives inside the tailnet; the runner joins it as an ephemeral node (a Tailscale OAuth client with scope auth_keys and the ACL tag tag:ci).
  # Secrets don't reach pull requests from forks, so it runs only for this repository's own branches.
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ingrid's library (import Ingrid/Decimal) is part of every build, as the standard library is: the builder reads
      # it from TESSERA_INGRID.
      - name: Checkout Ingrid
        uses: actions/checkout@v4
        with:
          repository: dj-lumiere/Ingrid
          path: ingrid-checkout

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LLVM 21
        run: |
          # A failed download must fail the step: piped into bash, an empty script would succeed and leave the
          # runner's own clang (18) in place, which crashes on some targets.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          test -x /usr/bin/clang-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-21 /usr/local/bin/ld.lld

      - name: Connect to tailnet for SonarQube
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install SonarScanner and dotnet-coverage
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: SonarQube begin
        run: |
          dotnet sonarscanner begin \
            /k:"Tessera" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"

      - name: Build
        run: dotnet build Tessera.csproj --configuration Release

      # The builder has no unit tests; its coverage is what the golden tests exercise.
      - name: Golden tests with coverage
        continue-on-error: true
        run: |
          dotnet-coverage collect -f xml -o coverage.xml \
            "dotnet bin/Release/net10.0/tessera.dll test tests examples"

      - name: SonarQube end
        if: always()
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
