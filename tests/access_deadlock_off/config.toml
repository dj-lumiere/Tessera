# Built with the deadlock check off: two threads take two accesses in opposite orders and wait for the second one with
# a time limit. Nothing looks for the cycle, so both wait out their time and give up instead of stopping the program.

[package]
name = "access_deadlock_off"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "src/main.te"

[debug]
deadlock-check = false
