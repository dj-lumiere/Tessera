# Built with the access-order check: taking two accesses in the opposite order of an earlier pair is a failure a check
# receives, and the access that would have been the second stays untaken.

[package]
name = "failure_access_order"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "src/main.li"

[debug]
access-order = true
