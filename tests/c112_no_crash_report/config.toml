# A board without a serial port has nowhere for a crash's default report to go: a when_power_on that puts no
# reporting routine in the Crash service's slot is a build error.

[package]
name = "c112_no_crash_report"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
board = "qemu-virt-riscv32"
executable = "src/main.te"
