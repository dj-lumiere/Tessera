# Runs on QEMU's virt machine (AArch64) without an operating system: rr_wait_same_names.qemu names the emulator, and the serial
# port's text is the output.

[package]
name = "rr_wait_same_names"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "main.li"
board = "qemu-virt-aarch64"
