# Built with the data race check: four threads add to one plain global with neither an atomic access nor a lock, and
# the check stops the program at the first race, with the crash exit status, before it prints.

[package]
name = "race_check_global"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "src/main.te"

[debug]
race-check = true
