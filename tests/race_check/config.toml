# Built with the data race check: two threads add to the same plain field with neither an atomic access nor a lock,
# and the check stops the program at the first race, with the crash exit status, before it prints.

[package]
name = "race_check"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "src/main.te"

[debug]
race-check = true
