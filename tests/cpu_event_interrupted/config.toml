# Built without the data race check: with it, the interrupt this test raises inside the handler doesn't return, and
# the program waits until the test runner stops it.

[package]
name = "cpu_event_interrupted"
version = "0.1.0"
lapila-version = "0.5.0"

[target]
executable = "src/main.lpa"

[debug]
race-check = false
