# Built with the deadlock check on in every build mode: two threads take two accesses in opposite orders, and the one
# that closes the cycle receives a DeadlockError.

[package]
name = "failure_access_deadlock"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "src/main.te"

[debug]
deadlock-check = true
