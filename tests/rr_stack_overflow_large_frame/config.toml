# Runs on QEMU's virt machine (AArch64) without an operating system: rr_stack_overflow.qemu names the emulator, and the serial
# port's text is the output.

[package]
name = "rr_stack_overflow_large_frame"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
board = "qemu-virt-aarch64"
