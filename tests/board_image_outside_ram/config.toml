# A board file of the project, named by its path: a board without flash runs its image from RAM, so the image's
# address is inside the RAM region.

[package]
name = "board_image_outside_ram"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
board = "boards/my-board.toml"
executable = "src/main.te"
