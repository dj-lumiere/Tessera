# A target without an operating system has no default heap: HEAP isn't there, so a collection takes a memory manager
# the program makes itself, and naming HEAP is a build error.

[package]
name = "default_heap_no_os"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
board = "qemu-mps2-an385"
executable = "src/main.te"
