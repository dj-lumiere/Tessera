# A target without an operating system has no default heap: the construct overloads without an allocator come from
# Standard::Os, which isn't there, so a collection takes the allocator the program passes.

[package]
name = "default_heap_no_os"
version = "0.1.0"
tessera-version = "0.1.0"

[target]
triple = "arm-none-eabi"
executable = "src/main.tess"
