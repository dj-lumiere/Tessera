# A crash's message is written into the Crash service's buffer, [crash] message-size bytes: a longer one is cut at a
# character's start and ends in an ellipsis.

[package]
name = "crash_message_cut"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "src/main.te"

[crash]
message-size = 32
