# Built with the access-order check: one thread takes two accesses in one order, then in the other. The check stops
# the program at the second order with AccessOrderError, before two threads doing both could wait on each other.

[package]
name = "access_order"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "src/main.te"

[debug]
access-order = true
