# A routine that calls itself without end: the fault report names the stack running out. The race check is off, since
# its own runtime reports a stack overflow before the program's fault report does.

[package]
name = "stack_overflow_report"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "src/main.te"

[debug]
race-check = false
