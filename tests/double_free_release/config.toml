# double_free in release mode (-O2): the heap check is the manifest's switch, not the build mode's, so an optimized
# build with it on crashes with DoubleFreeError at the line of the second destruct() just like a debug build.

[package]
name = "double_free_release"
version = "0.1.0"
tessera-version = "0.1.0"

[target]
mode = "release"
executable = "src/main.tess"

[debug]
heap-check = true
