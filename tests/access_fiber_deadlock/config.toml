# Built with the deadlock check on in every build mode (two fibers of one thread take two accesses in opposite orders). A release build leaves the check off by
# default, and the program would then wait forever.

[package]
name = "access_fiber_deadlock"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "src/main.te"

[debug]
deadlock-check = true
