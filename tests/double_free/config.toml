# The heap check on: the default heap checks every free, and a block freed twice crashes with DoubleFreeError at the
# line of the second destruct(). The check doesn't depend on the build mode (double_free_release is the same program in
# release mode), and `tessera test` turns it on anyway.

[package]
name = "double_free"
version = "0.1.0"
tessera-version = "0.1.0"

[target]
executable = "src/main.tess"

[debug]
heap-check = true
