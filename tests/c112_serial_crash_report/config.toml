# Runs on QEMU's virt machine (AArch64) without an operating system: its board file names the PL011 serial port, so a
# crash with no reporting routine in the Crash service's slot is reported there, then the core stops.

[package]
name = "c112_serial_crash_report"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
board = "qemu-virt-aarch64"
