# Files without a `module` line take their module path from their place: tools/numbers.te next to config.toml is
# Tools/Numbers, and shared/money/tax.te in a module-paths folder is Money/Tax (the deepest folder that holds it).

[package]
name = "place"
version = "0.1.0"
tessera-version = "0.5.0"

[target]
executable = "main.te"
module-paths = ["shared"]
