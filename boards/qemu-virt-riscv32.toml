# QEMU's virt machine for 32-bit RISC-V, booting from its first flash bank (qemu-system-riscv32 -M virt -bios none
# -drive if=pflash,unit=0,format=raw,file=program.bin): the reset jumps to the start of the flash at 0x20000000, and
# the 128 MiB of RAM are at 0x80000000.

[board]
name = "QEMU virt (RISC-V 32)"
triple = "riscv32-none-elf"

[memory]
flash = { start = 0x20000000, size = "32mib" }
ram = { start = 0x80000000, size = "128mib" }
