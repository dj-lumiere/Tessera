# Raspberry Pi 4 Model B, core 0 at the level the firmware (or QEMU's -kernel) starts it at. The firmware loads
# kernel8.img at 0x80000 and jumps there. The MMU is off, so every access is to device memory and must be aligned.
# The RAM is the first 948 MiB, below the memory the firmware keeps for the GPU.

[board]
name = "Raspberry Pi 4 Model B"
triple = "aarch64-none-elf"
cpu = "cortex-a72"
features = ["strict-align"]

[memory]
image = 0x80000
ram = { start = 0x0, size = "948mib" }
