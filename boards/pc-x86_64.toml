# A PC whose loader starts the core in 64-bit mode with the image at 2 MiB and sends it to when_power_on. The RAM
# used is 1 MiB up to 128 MiB, above the memory the firmware and the video card keep below 1 MiB.

[board]
name = "PC (x86_64)"
triple = "x86_64-none-elf"

[memory]
image = 0x200000
ram = { start = 0x100000, size = "127mib" }
