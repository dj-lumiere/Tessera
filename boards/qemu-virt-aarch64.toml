# QEMU's virt machine for AArch64 (qemu-system-aarch64 -M virt -cpu cortex-a53 -kernel program): QEMU loads the ELF
# file at its addresses, inside the machine's 128 MiB of RAM at 0x40000000, past the device tree QEMU puts at its start.

[board]
name = "QEMU virt (AArch64)"
triple = "aarch64-none-elf"

[memory]
image = 0x40080000
ram = { start = 0x40000000, size = "128mib" }
