# QEMU's mps2-an385 machine, a Cortex-M3 (qemu-system-arm -M mps2-an385 -kernel program): the core reads its vector
# table at 0x0, the start of the 4 MiB code memory, and runs from there. The data memory is 4 MiB at 0x20000000.

[board]
name = "QEMU mps2-an385 (Cortex-M3)"
triple = "arm-none-eabi"
cpu = "cortex-m3"

[memory]
flash = { start = 0x0, size = "4mib" }
ram = { start = 0x20000000, size = "4mib" }
